name: Security Check - Python

on: [pull_request, push]

jobs:
  bandit:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      # security-events: write

    steps:
      - name: Setup GitHub Actions
        uses: actions/checkout@master

      - name: Install Python
        uses: actions/setup-python@master
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip3 install bandit

      - name: Run Bandit
        run: bandit -r ./backend -x ./backend/tests

  pytest:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Setup GitHub Actions
        uses: actions/checkout@master

      - name: Install Python
        uses: actions/setup-python@master
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip3 install -r backend/tests/requirements.txt

      # Unit tests run here; integration tests auto-skip (the local stack
      # isn't reachable in CI).
      - name: Run pytest
        run: cd backend/tests && python -m pytest
